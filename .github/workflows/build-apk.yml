name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor and build
        run: |
          cd pwa
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "AI Learning Cards" com.example.ai_learning_cards --web-dir .
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd pwa/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-learning-cards-apk
          path: pwa/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
