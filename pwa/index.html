<title>AI Learning Cards</title>
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-light: #334155;
  --primary: #38bdf8;
  --primary-dark: #0ea5e9;
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --success: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --card-gradient-start: #1e293b;
  --card-gradient-end: #0f172a;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
}

#app-wrapper {
  width: 100%;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.page {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: none;
  padding: 16px;
  padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  -webkit-overflow-scrolling: touch;
}

.page.active { display: block; }

/* Header */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-top: env(safe-area-inset-top, 0px);
}

.page-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}

.back-btn {
  background: none;
  border: none;
  color: var(--primary);
  font-size: 16px;
  cursor: pointer;
  padding: 8px 0;
}

/* Progress */
.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--surface-light);
  border-radius: 2px;
  margin-bottom: 16px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  border-radius: 2px;
  transition: width 0.3s ease;
}

.progress-text {
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

/* Card Stack */
.card-stack {
  position: relative;
  width: 100%;
  height: 420px;
  margin-bottom: 16px;
}

.card {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(145deg, var(--card-gradient-start), var(--card-gradient-end));
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  cursor: grab;
  transition: transform 0.1s linear, opacity 0.2s ease;
  user-select: none;
  touch-action: pan-y;
}

.card:active { cursor: grabbing; }

.card-category {
  font-size: 11px;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  font-weight: 600;
}

.card-term {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  line-height: 1.3;
}

.card-def {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-secondary);
  flex: 1;
  overflow: hidden;
}

.card-def-en {
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-def-cn {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: auto;
  padding-top: 12px;
}

.card-badge {
  position: absolute;
  top: 24px;
  padding: 6px 16px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.15s ease;
  pointer-events: none;
}

.badge-left {
  left: 24px;
  border: 2px solid var(--danger);
  color: var(--danger);
  transform: rotate(-12deg);
}

.badge-right {
  right: 24px;
  border: 2px solid var(--success);
  color: var(--success);
  transform: rotate(12deg);
}

/* Empty State */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 420px;
  text-align: center;
  color: var(--text-secondary);
}

.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
.empty-desc { font-size: 14px; color: var(--text-muted); }

/* Detail Page */
.detail-card {
  background: linear-gradient(145deg, var(--card-gradient-start), var(--card-gradient-end));
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
  margin-bottom: 16px;
}

.detail-section {
  margin-bottom: 20px;
}

.detail-section:last-child { margin-bottom: 0; }

.detail-label {
  font-size: 11px;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 600;
}

.detail-content {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-secondary);
}

.detail-content.term { font-size: 22px; font-weight: 700; color: var(--text); }

.detail-actions {
  display: flex;
  gap: 12px;
  position: sticky;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}

.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.btn-review {
  background: rgba(248, 113, 113, 0.15);
  color: var(--danger);
  border: 1px solid rgba(248, 113, 113, 0.3);
}

.btn-review:active { background: rgba(248, 113, 113, 0.3); }

.btn-learned {
  background: rgba(52, 211, 153, 0.15);
  color: var(--success);
  border: 1px solid rgba(52, 211, 153, 0.3);
}

.btn-learned:active { background: rgba(52, 211, 153, 0.3); }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #0f172a;
}

.btn-primary:active { opacity: 0.85; }

/* List Pages */
.list-item {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background 0.15s ease;
  border: 1px solid rgba(255,255,255,0.04);
}

.list-item:active { background: var(--surface-light); }

.list-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-none { background: var(--text-muted); }
.status-review { background: var(--warning); }
.status-learned { background: var(--success); }

.list-info {
  flex: 1;
  min-width: 0;
}

.list-term {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.list-meta {
  font-size: 12px;
  color: var(--text-muted);
}

.list-arrow {
  color: var(--text-muted);
  font-size: 14px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.tab {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: var(--surface);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}

.tab.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #0f172a;
  font-weight: 600;
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 20px 12px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.04);
}

.stat-number {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 4px;
}

.stat-number.learned { color: var(--success); }
.stat-number.review { color: var(--warning); }
.stat-number.total { color: var(--primary); }

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
}

/* Settings */
.setting-item {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.04);
}

.setting-item:active { background: var(--surface-light); }

.setting-label {
  font-size: 15px;
  color: var(--text);
}

.setting-value {
  font-size: 14px;
  color: var(--text-muted);
}

/* Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 0;
  cursor: pointer;
  color: var(--text-muted);
  transition: color 0.2s ease;
  border: none;
  background: none;
  font-family: inherit;
}

.nav-item.active { color: var(--primary); }

.nav-icon { font-size: 20px; line-height: 1; }
.nav-label { font-size: 11px; font-weight: 500; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-light); border-radius: 2px; }

/* Animations */
@keyframes slideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.page.active { animation: slideIn 0.25s ease; }

@keyframes popIn {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.card-enter { animation: popIn 0.3s ease; }

/* Category filter */
.filter-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 16px;
  padding-bottom: 4px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.filter-chips::-webkit-scrollbar { display: none; }

.chip {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  background: var(--surface);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}

.chip.active {
  background: var(--primary);
  color: #0f172a;
  border-color: var(--primary);
  font-weight: 600;
}
</style>
</head>
<body>

<div id="app-wrapper">

<!-- HOME PAGE -->
<div id="home" class="page active">
  <div class="page-header">
    <div class="page-title">每日抽卡</div>
  </div>
  <div class="progress-text" id="progressText">准备中...</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="cardContainer">
    <div class="card-stack" id="cardStack"></div>
    <div class="card-hint" style="text-align:center;color:var(--text-muted);font-size:13px;margin-top:8px;">
      ← 左滑：待复习 · 点击看详情 · 右滑：已学习 →
    </div>
  </div>
  <div id="homeEmpty" class="empty-state" style="display:none;">
    <div class="empty-icon">🎉</div>
    <div class="empty-title">今日任务完成</div>
    <div class="empty-desc">所有卡片已学习，明天再来吧</div>
  </div>
</div>

<!-- DETAIL PAGE -->
<div id="detail" class="page">
  <div class="page-header">
    <button class="back-btn" onclick="router.back()">← 返回</button>
  </div>
  <div id="detailContent"></div>
  <div class="detail-actions">
    <button class="btn btn-review" onclick="app.markFromDetail('review')">标记为待复习</button>
    <button class="btn btn-learned" onclick="app.markFromDetail('learned')">标记为已学习</button>
  </div>
</div>

<!-- REVIEW PAGE (with tabs for review/learned) -->
<div id="review" class="page">
  <div class="page-header">
    <div class="page-title" id="reviewTitle">复习</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="app.switchReviewTab('review')" id="tabReview">待复习</button>
    <button class="tab" onclick="app.switchReviewTab('learned')" id="tabLearned">已学习</button>
  </div>
  <div id="reviewList"></div>
  <div id="reviewEmpty" class="empty-state" style="display:none;height:auto;margin-top:40px;">
    <div class="empty-icon">📭</div>
    <div class="empty-title">暂无卡片</div>
    <div class="empty-desc" id="reviewEmptyDesc">去首页抽卡学习吧</div>
  </div>
</div>

<!-- LIBRARY PAGE -->
<div id="library" class="page">
  <div class="page-header">
    <div class="page-title">词库</div>
  </div>
  <div class="filter-chips" id="filterChips">
    <button class="chip active" onclick="app.filterCategory('all')">全部</button>
    <button class="chip" onclick="app.filterCategory('基础概念')">基础概念</button>
    <button class="chip" onclick="app.filterCategory('模型架构')">模型架构</button>
    <button class="chip" onclick="app.filterCategory('训练技术')">训练技术</button>
    <button class="chip" onclick="app.filterCategory('推理优化')">推理优化</button>
    <button class="chip" onclick="app.filterCategory('应用落地')">应用落地</button>
    <button class="chip" onclick="app.filterCategory('评估指标')">评估指标</button>
    <button class="chip" onclick="app.filterCategory('数据工程')">数据工程</button>
    <button class="chip" onclick="app.filterCategory('多模态')">多模态</button>
    <button class="chip" onclick="app.filterCategory('安全对齐')">安全对齐</button>
    <button class="chip" onclick="app.filterCategory('行业术语')">行业术语</button>
  </div>
  <div id="libraryList"></div>
</div>

<!-- STATS PAGE -->
<div id="stats" class="page">
  <div class="page-header">
    <div class="page-title">统计</div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number learned" id="statLearned">0</div>
      <div class="stat-label">已掌握</div>
    </div>
    <div class="stat-card">
      <div class="stat-number review" id="statReview">0</div>
      <div class="stat-label">待复习</div>
    </div>
    <div class="stat-card">
      <div class="stat-number total" id="statTotal">0</div>
      <div class="stat-label">未学习</div>
    </div>
  </div>
  <div style="background:var(--surface);border-radius:12px;padding:16px;margin-bottom:12px;">
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">掌握进度</div>
    <div class="progress-bar" style="margin-bottom:8px;"><div class="progress-fill" id="statProgress" style="width:0%"></div></div>
    <div style="font-size:14px;color:var(--text-secondary);" id="statProgressText">0 / 100</div>
  </div>
  <div style="background:var(--surface);border-radius:12px;padding:16px;">
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">分类统计</div>
    <div id="categoryStats"></div>
  </div>
</div>

<!-- SETTINGS PAGE -->
<div id="settings" class="page">
  <div class="page-header">
    <div class="page-title">设置</div>
  </div>
  <div class="setting-item" onclick="app.resetDaily()">
    <span class="setting-label">重置今日抽卡</span>
    <span class="setting-value">重新抽取</span>
  </div>
  <div class="setting-item" onclick="app.clearAllData()">
    <span class="setting-label">清除所有学习记录</span>
    <span class="setting-value" style="color:var(--danger);">⚠️ 不可恢复</span>
  </div>
  <div style="margin-top:20px;padding:16px;background:var(--surface);border-radius:12px;">
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">关于</div>
    <div style="font-size:14px;color:var(--text-secondary);line-height:1.6;">
      AI Learning Cards<br>
      100个AI大模型核心术语<br>
      单机离线版，数据保存在本地
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" data-target="home" onclick="router.go('home')">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">首页</span>
  </button>
  <button class="nav-item" data-target="library" onclick="router.go('library')">
    <span class="nav-icon">📚</span>
    <span class="nav-label">词库</span>
  </button>
  <button class="nav-item" data-target="review" onclick="router.go('review')">
    <span class="nav-icon">🔄</span>
    <span class="nav-label">复习</span>
  </button>
  <button class="nav-item" data-target="stats" onclick="router.go('stats')">
    <span class="nav-icon">📊</span>
    <span class="nav-label">统计</span>
  </button>
  <button class="nav-item" data-target="settings" onclick="router.go('settings')">
    <span class="nav-icon">⚙️</span>
    <span class="nav-label">设置</span>
  </button>
</nav>

</div><!-- /app-wrapper -->

<script>

    "term": "BERTScore",
    "en_definition": "An evaluation metric that compares generated text to references using contextual embeddings rather than exact word matches. It captures semantic similarity even when wording differs completely.",
    "cn_definition": "一种使用上下文嵌入而非精确词语匹配来比较生成文本与参考文本的评估指标。即使措辞完全不同，它也能捕捉语义相似性。",
    "example": "BERTScore recognizes 'The meal was delicious' and 'The food tasted wonderful' as highly similar, while BLEU would give them a low score. / BERTScore识别'The meal was delicious'和'The food tasted wonderful'高度相似，而BLEU会给它们低分。",
    "category": "评估指标",
    "id": 99
  }
];

// ==================== STORAGE ====================
const Storage = {
  key: 'ai-learning-cards-v1',
  get() {
    try {
      const raw = localStorage.getItem(this.key);
      return raw ? JSON.parse(raw) : { records: {}, lastDrawDate: null, todayCards: [], currentIndex: 0 };
    } catch (e) { return { records: {}, lastDrawDate: null, todayCards: [], currentIndex: 0 }; }
  },
  set(data) {
    localStorage.setItem(this.key, JSON.stringify(data));
  },
  clear() {
    localStorage.removeItem(this.key);
  }
};

// ==================== ROUTER ====================
const router = {
  history: [],
  go(page) {
    this.history.push(page);
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.target === page));
    if (page === 'library') app.renderLibrary();
    if (page === 'review') app.renderReviewList();
    if (page === 'stats') app.renderStats();
  },
  back() {
    this.history.pop();
    const prev = this.history.length ? this.history[this.history.length - 1] : 'home';
    this.go(prev);
  },
  init() {
    this.history = ['home'];
  }
};

// ==================== APP ====================
const app = {
  state: null,
  currentCardId: null,
  reviewTab: 'review',
  libraryFilter: 'all',

  init() {
    this.state = Storage.get();
    this.checkDailyReset();
    this.drawDailyCards();
    this.renderHome();
    router.init();
  },

  checkDailyReset() {
    const today = new Date().toDateString();
    if (this.state.lastDrawDate !== today) {
      this.state.lastDrawDate = today;
      this.state.todayCards = [];
      this.state.currentIndex = 0;
      this.drawDailyCards();
      Storage.set(this.state);
    }
  },

  drawDailyCards() {
    if (this.state.todayCards.length > 0) return;
    const pool = CARDS.filter(c => {
      const st = this.state.records[c.id];
      return st !== 'learned';
    }).map(c => c.id);
    // Shuffle
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    this.state.todayCards = pool.slice(0, 5);
    this.state.currentIndex = 0;
    Storage.set(this.state);
  },

  getStatus(id) {
    return this.state.records[id] || 'none';
  },

  setStatus(id, status) {
    this.state.records[id] = status;
    Storage.set(this.state);
  },

  renderHome() {
    const container = document.getElementById('cardStack');
    const empty = document.getElementById('homeEmpty');
    const cardContainer = document.getElementById('cardContainer');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');

    const remaining = this.state.todayCards.slice(this.state.currentIndex);
    const total = this.state.todayCards.length;
    const done = this.state.currentIndex;

    progressText.textContent = total > 0 ? `${done}/${total}` : '今日完成';
    progressFill.style.width = total > 0 ? `${(done/total)*100}%` : '100%';

    if (remaining.length === 0) {
      container.innerHTML = '';
      empty.style.display = 'flex';
      cardContainer.style.display = 'none';
      return;
    }

    empty.style.display = 'none';
    cardContainer.style.display = 'block';

    // Render top 2 cards for stack effect
    container.innerHTML = '';
    remaining.slice(0, 2).reverse().forEach((id, idx) => {
      const card = CARDS.find(c => c.id === id);
      const el = document.createElement('div');
      el.className = 'card' + (idx === 0 ? ' card-enter' : '');
      el.dataset.id = card.id;
      el.innerHTML = `
        <div class="card-category">${card.category}</div>
        <div class="card-term">${this.escapeHtml(card.term)}</div>
        <div class="card-def">
          <div class="card-def-en">${this.escapeHtml(card.en_definition)}</div>
          <div class="card-def-cn">${this.escapeHtml(card.cn_definition)}</div>
        </div>
        <div class="card-hint">点击查看详情</div>
        <div class="card-badge badge-left">待复习</div>
        <div class="card-badge badge-right">已学习</div>
      `;
      el.addEventListener('click', () => {
        if (el.dataset.noclick) { delete el.dataset.noclick; return; }
        this.openDetail(card.id);
      });
      this.attachSwipe(el, card.id);
      container.appendChild(el);
    });
  },

  attachSwipe(el, cardId) {
    let startX = 0, startY = 0, currentX = 0, currentY = 0, isDragging = false;

    el.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isDragging = true;
      el.style.transition = 'none';
      delete el.dataset.noclick;
    }, { passive: true });

    el.addEventListener('touchmove', e => {
      if (!isDragging) return;
      currentX = e.touches[0].clientX - startX;
      currentY = e.touches[0].clientY - startY;
      if (Math.abs(currentX) > Math.abs(currentY)) {
        el.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
        const badgeLeft = el.querySelector('.badge-left');
        const badgeRight = el.querySelector('.badge-right');
        if (badgeLeft) badgeLeft.style.opacity = currentX < -40 ? Math.min(1, Math.abs(currentX) / 100) : 0;
        if (badgeRight) badgeRight.style.opacity = currentX > 40 ? Math.min(1, currentX / 100) : 0;
      }
    }, { passive: true });

    el.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      el.style.transition = 'transform 0.3s ease, opacity 0.2s ease';

      if (currentX < -60) {
        el.dataset.noclick = 'true';
        el.style.transform = `translateX(-120%) rotate(-20deg)`;
        el.style.opacity = '0';
        setTimeout(() => this.handleSwipe(cardId, 'review'), 200);
      } else if (currentX > 60) {
        el.dataset.noclick = 'true';
        el.style.transform = `translateX(120%) rotate(20deg)`;
        el.style.opacity = '0';
        setTimeout(() => this.handleSwipe(cardId, 'learned'), 200);
      } else {
        el.style.transform = '';
        el.querySelector('.badge-left').style.opacity = 0;
        el.querySelector('.badge-right').style.opacity = 0;
      }
      currentX = 0;
    });

    // Mouse support for desktop
    el.addEventListener('mousedown', e => {
      startX = e.clientX;
      startY = e.clientY;
      isDragging = true;
      el.style.transition = 'none';
      delete el.dataset.noclick;
    });

    el.addEventListener('mousemove', e => {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      if (Math.abs(currentX) > Math.abs(currentY)) {
        el.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
        const badgeLeft = el.querySelector('.badge-left');
        const badgeRight = el.querySelector('.badge-right');
        if (badgeLeft) badgeLeft.style.opacity = currentX < -40 ? Math.min(1, Math.abs(currentX) / 100) : 0;
        if (badgeRight) badgeRight.style.opacity = currentX > 40 ? Math.min(1, currentX / 100) : 0;
      }
    });

    el.addEventListener('mouseup', e => {
      if (!isDragging) return;
      isDragging = false;
      el.style.transition = 'transform 0.3s ease, opacity 0.2s ease';
      if (currentX < -60) {
        el.dataset.noclick = 'true';
        el.style.transform = `translateX(-120%) rotate(-20deg)`;
        el.style.opacity = '0';
        setTimeout(() => this.handleSwipe(cardId, 'review'), 200);
      } else if (currentX > 60) {
        el.dataset.noclick = 'true';
        el.style.transform = `translateX(120%) rotate(20deg)`;
        el.style.opacity = '0';
        setTimeout(() => this.handleSwipe(cardId, 'learned'), 200);
      } else {
        el.style.transform = '';
        el.querySelector('.badge-left').style.opacity = 0;
        el.querySelector('.badge-right').style.opacity = 0;
      }
      currentX = 0;
    });

    el.addEventListener('mouseleave', () => {
      if (!isDragging) return;
      isDragging = false;
      el.style.transition = 'transform 0.3s ease';
      el.style.transform = '';
      el.querySelector('.badge-left').style.opacity = 0;
      el.querySelector('.badge-right').style.opacity = 0;
      currentX = 0;
    });
  },

  handleSwipe(cardId, status) {
    this.setStatus(cardId, status);
    this.state.currentIndex++;
    Storage.set(this.state);
    this.renderHome();
  },

  openDetail(cardId) {
    this.currentCardId = cardId;
    const card = CARDS.find(c => c.id === cardId);
    const el = document.getElementById('detailContent');
    el.innerHTML = `
      <div class="detail-card">
        <div class="detail-section">
          <div class="detail-label">分类</div>
          <div class="detail-content">${card.category}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">术语</div>
          <div class="detail-content term">${this.escapeHtml(card.term)}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">英文定义</div>
          <div class="detail-content">${this.escapeHtml(card.en_definition)}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">中文定义</div>
          <div class="detail-content">${this.escapeHtml(card.cn_definition)}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">案例</div>
          <div class="detail-content">${this.escapeHtml(card.example)}</div>
        </div>
      </div>
    `;
    router.go('detail');
  },

  markFromDetail(status) {
    if (this.currentCardId == null) return;
    this.setStatus(this.currentCardId, status);
    // Remove from today's cards if present and not yet processed
    const idx = this.state.todayCards.indexOf(this.currentCardId);
    if (idx !== -1 && idx >= this.state.currentIndex) {
      this.state.todayCards.splice(idx, 1);
      Storage.set(this.state);
    }
    router.back();
    this.renderHome();
  },

  switchReviewTab(tab) {
    this.reviewTab = tab;
    document.getElementById('tabReview').classList.toggle('active', tab === 'review');
    document.getElementById('tabLearned').classList.toggle('active', tab === 'learned');
    this.renderReviewList();
  },

  renderReviewList() {
    const list = document.getElementById('reviewList');
    const empty = document.getElementById('reviewEmpty');
    const emptyDesc = document.getElementById('reviewEmptyDesc');

    const ids = Object.entries(this.state.records)
      .filter(([_, s]) => s === this.reviewTab)
      .map(([id, _]) => parseInt(id));

    if (ids.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'flex';
      emptyDesc.textContent = this.reviewTab === 'review' ? '去首页抽卡学习吧' : '还没有已学习的卡片';
      return;
    }

    empty.style.display = 'none';
    list.innerHTML = ids.map(id => {
      const card = CARDS.find(c => c.id === id);
      return `
        <div class="list-item" onclick="app.openDetail(${card.id})">
          <div class="list-status status-${this.reviewTab}"></div>
          <div class="list-info">
            <div class="list-term">${this.escapeHtml(card.term)}</div>
            <div class="list-meta">${card.category}</div>
          </div>
          <div class="list-arrow">›</div>
        </div>
      `;
    }).join('');
  },

  renderLibrary() {
    const list = document.getElementById('libraryList');
    let cards = CARDS;
    if (this.libraryFilter !== 'all') {
      cards = cards.filter(c => c.category === this.libraryFilter);
    }
    list.innerHTML = cards.map(card => {
      const status = this.getStatus(card.id);
      const statusClass = status === 'learned' ? 'status-learned' : status === 'review' ? 'status-review' : 'status-none';
      return `
        <div class="list-item" onclick="app.openDetail(${card.id})">
          <div class="list-status ${statusClass}"></div>
          <div class="list-info">
            <div class="list-term">${this.escapeHtml(card.term)}</div>
            <div class="list-meta">${card.category} · ${status === 'learned' ? '已学' : status === 'review' ? '复习' : '未学'}</div>
          </div>
          <div class="list-arrow">›</div>
        </div>
      `;
    }).join('');
  },

  filterCategory(cat) {
    this.libraryFilter = cat;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === (cat === 'all' ? '全部' : cat)));
    this.renderLibrary();
  },

  renderStats() {
    let learned = 0, review = 0, none = 0;
    CARDS.forEach(c => {
      const s = this.getStatus(c.id);
      if (s === 'learned') learned++;
      else if (s === 'review') review++;
      else none++;
    });

    document.getElementById('statLearned').textContent = learned;
    document.getElementById('statReview').textContent = review;
    document.getElementById('statTotal').textContent = none;
    document.getElementById('statProgress').style.width = `${((learned + review) / CARDS.length) * 100}%`;
    document.getElementById('statProgressText').textContent = `${learned + review} / ${CARDS.length}`;

    // Category stats
    const cats = {};
    CARDS.forEach(c => {
      if (!cats[c.category]) cats[c.category] = { total: 0, learned: 0 };
      cats[c.category].total++;
      if (this.getStatus(c.id) === 'learned') cats[c.category].learned++;
    });

    const catEl = document.getElementById('categoryStats');
    catEl.innerHTML = Object.entries(cats).map(([name, data]) => {
      const pct = Math.round((data.learned / data.total) * 100);
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <span style="font-size:14px;color:var(--text-secondary);">${name}</span>
          <span style="font-size:13px;color:var(--text-muted);">${data.learned}/${data.total} (${pct}%)</span>
        </div>
        <div class="progress-bar" style="margin-bottom:14px;height:6px;"><div class="progress-fill" style="width:${pct}%"></div></div>
      `;
    }).join('');
  },

  resetDaily() {
    if (!confirm('确定要重新抽取今日卡片吗？')) return;
    this.state.todayCards = [];
    this.state.currentIndex = 0;
    this.drawDailyCards();
    Storage.set(this.state);
    this.renderHome();
    if (document.getElementById('home').classList.contains('active')) return;
    router.go('home');
  },

  clearAllData() {
    if (!confirm('确定要清除所有学习记录吗？此操作不可恢复。')) return;
    Storage.clear();
    this.state = { records: {}, lastDrawDate: null, todayCards: [], currentIndex: 0 };
    this.drawDailyCards();
    this.renderHome();
    router.go('home');
  },

  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
};

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  app.init();
});

// ==================== SERVICE WORKER (Inline via Blob) ====================
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
